get:
  operationId: listUsers
  tags: [Admin - Users]
  summary: Danh sach tat ca nguoi dung
  description: |
    Nhan vien van hanh/Admin xem danh sach khach hang va tai xe, co bo loc.
    status=pending dung de loc ho so tai xe cho duyet (FR-ADM-01).
    Lien quan: FR-ADM-01, BR-21, RULE-08
  security:
    - BearerAuth: []
  parameters:
    - name: role
      in: query
      schema:
        type: string
        enum: [customer, driver]
    - name: status
      in: query
      schema:
        type: string
        enum: [active, pending, banned]
    - name: search
      in: query
      schema:
        type: string
      description: Tim theo ten hoac SDT
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        default: 20
  responses:
    "200":
      description: Thanh cong
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      type: string
                    fullName:
                      type: string
                    phone:
                      type: string
                    role:
                      type: string
                      enum: [customer, driver]
                    status:
                      type: string
                      enum: [active, pending, banned]
              total:
                type: integer
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
    "403":
      $ref: '../../components/responses/_index.yaml#/Forbidden'
