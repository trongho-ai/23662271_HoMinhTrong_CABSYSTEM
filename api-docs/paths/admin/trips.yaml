get:
  operationId: listAdminTrips
  tags: [Admin - Trips]
  summary: Danh sach chuyen di (Giam sat)
  description: |
    Dashboard giam sat chuyen dang dien ra va tra cuu lich su/giao dich (FR-ADM-03).
    Lien quan: FR-ADM-02, FR-ADM-03, BR-22, BR-23
  security:
    - BearerAuth: []
  parameters:
    - name: status
      in: query
      schema:
        type: string
        enum: [finding, assigned, arrived, in_progress, completed, cancelled]
    - name: startDate
      in: query
      schema:
        type: string
        format: date
    - name: endDate
      in: query
      schema:
        type: string
        format: date
    - name: driverId
      in: query
      schema:
        type: string
    - name: customerId
      in: query
      schema:
        type: string
    - name: page
      in: query
      schema:
        type: integer
        default: 1
  responses:
    "200":
      description: Thanh cong
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../components/schemas/_index.yaml#/Trip'
              total:
                type: integer
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
    "403":
      $ref: '../../components/responses/_index.yaml#/Forbidden'
