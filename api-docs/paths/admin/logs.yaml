get:
  operationId: listLogs
  tags: [Admin - Logs]
  summary: Xem System Log va Audit Log
  description: |
    Tra cuu nhat ky thao tac cua admin va loi he thong nghiem trong.
    Lien quan: FR-ADM-06, BR-33, BR-34, RULE-10
    Use Case: UC-ADM-02, AC-03
  security:
    - BearerAuth: []
  parameters:
    - name: type
      in: query
      schema:
        type: string
        enum: [audit, system_error]
        default: audit
    - name: adminId
      in: query
      schema:
        type: string
    - name: startDate
      in: query
      schema:
        type: string
        format: date
    - name: endDate
      in: query
      schema:
        type: string
        format: date
    - name: page
      in: query
      schema:
        type: integer
        default: 1
  responses:
    "200":
      description: Thanh cong
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../components/schemas/_index.yaml#/AuditLog'
              total:
                type: integer
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
    "403":
      $ref: '../../components/responses/_index.yaml#/Forbidden'
