post:
  operationId: rejectTrip
  tags: [Trips]
  summary: Tai xe tu choi chuyen
  description: |
    Tai xe bam tu choi yeu cau (hoac het thoi gian dem nguoc - AC-03 xu ly tuong tu).
    He thong tu dong day yeu cau cho tai xe phu hop tiep theo (FR-SYS-02), khach hang
    khong can tao lai yeu cau (EX-01).
    Lien quan: FR-SYS-02, BR-12, EX-01
    Use Case: UC-DRV-03 (Ngoai le A1), AC-03
  security:
    - BearerAuth: []
  parameters:
    - name: tripId
      in: path
      required: true
      schema:
        type: string
  responses:
    "200":
      description: Tu choi chuyen, he thong tim tai xe khac
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Da tu choi. He thong dang tim tai xe khac."
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
    "404":
      $ref: '../../components/responses/_index.yaml#/NotFound'
