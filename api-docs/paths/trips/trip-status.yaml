patch:
  operationId: updateTripStatus
  tags: [Trips]
  summary: Cap nhat trang thai chuyen di (Tai xe)
  description: |
    Tai xe cap nhat tuan tu: arrived -> in_progress -> completed. Khong duoc nhay coc
    (AC-01). Moi lan cap nhat kich hoat Push Notification cho khach hang trong vong
    2 giay (AC-02).
    Lien quan: FR-DRV-04, BR-09, RULE-05, RULE-06
    Use Case: UC-DRV-04, AC-01 (rang buoc tuan tu), AC-02 (dong bo 2s)
  security:
    - BearerAuth: []
  parameters:
    - name: tripId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [arrived, in_progress, completed]
              description: |
                - arrived: Tai xe da den diem don
                - in_progress: Da don khach, dang di chuyen
                - completed: Hoan thanh chuyen (kich hoat tinh cuoc - FR-SYS-04)
  responses:
    "200":
      description: Cap nhat trang thai thanh cong
      content:
        application/json:
          schema:
            type: object
            properties:
              tripId:
                type: string
              newStatus:
                type: string
              actualFare:
                type: number
                nullable: true
                description: "Chi tra ve khi newStatus=completed (FR-SYS-04)."
    "400":
      description: Trang thai khong hop le (sai thu tu, VD nhay coc tu 'arrived' sang 'completed')
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: "INVALID_STATUS_TRANSITION"
              message:
                type: string
                example: "Phai cap nhat theo thu tu: arrived -> in_progress -> completed"
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
    "403":
      description: Khong phai tai xe duoc gan cho chuyen nay
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/_index.yaml#/ErrorResponse'
    "404":
      $ref: '../../components/responses/_index.yaml#/NotFound'
