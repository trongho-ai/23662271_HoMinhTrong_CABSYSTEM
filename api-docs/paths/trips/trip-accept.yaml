post:
  operationId: acceptTrip
  tags: [Trips]
  summary: Tai xe chap nhan chuyen
  description: |
    Tai xe bam chap nhan yeu cau chuyen di trong thoi gian dem nguoc (AC-02).
    He thong gan DriverID vao Trip, trang thai chuyen sang 'assigned'.
    Lien quan: FR-DRV-03, BR-08, RULE-01
    Use Case: UC-DRV-03, AC-02
  security:
    - BearerAuth: []
  parameters:
    - name: tripId
      in: path
      required: true
      schema:
        type: string
  responses:
    "200":
      description: Chap nhan chuyen thanh cong
      content:
        application/json:
          schema:
            type: object
            properties:
              tripId:
                type: string
              status:
                type: string
                example: "assigned"
              pickupLocation:
                $ref: '../../components/schemas/_index.yaml#/Location'
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
    "403":
      description: Khong phai tai xe duoc he thong de xuat cho chuyen nay
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/_index.yaml#/ErrorResponse'
    "404":
      $ref: '../../components/responses/_index.yaml#/NotFound'
    "409":
      description: Chuyen da het thoi gian de xuat hoac da duoc tai xe khac nhan (EX-01)
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: "TRIP_ALREADY_ASSIGNED"
              message:
                type: string
                example: "Chuyen nay da duoc tai xe khac nhan"
