get:
  operationId: getTripDetail
  tags: [Trips]
  summary: Lay chi tiet mot chuyen di
  description: |
    Xem thong tin chi tiet chuyen di: vi tri, trang thai, tai xe, ETA.
    Dung de hien thi man hinh Tracking real-time (FR-CUS-05). Client nen goi lai
    (polling) dinh ky de cap nhat vi tri tai xe/ETA trong luc chuyen dang dien ra.
    Lien quan: FR-CUS-05, BR-03
    Use Case: UC-CUS-03
  security:
    - BearerAuth: []
  parameters:
    - name: tripId
      in: path
      required: true
      schema:
        type: string
      example: "TRIP-001"
  responses:
    "200":
      description: Thanh cong
      content:
        application/json:
          schema:
            type: object
            properties:
              tripId:
                type: string
                example: "TRIP-001"
              status:
                type: string
                enum: [finding, assigned, arrived, in_progress, completed, cancelled]
              pickupLocation:
                $ref: '../../components/schemas/_index.yaml#/Location'
              dropoffLocation:
                $ref: '../../components/schemas/_index.yaml#/Location'
              driver:
                type: object
                nullable: true
                description: "Null khi status='finding' (chua co tai xe)."
                properties:
                  driverId:
                    type: string
                  fullName:
                    type: string
                  phone:
                    type: string
                  currentLocation:
                    $ref: '../../components/schemas/_index.yaml#/Location'
                  eta:
                    type: integer
                    description: "Thoi gian du kien den (giay). Lien quan: FR-CUS-05."
              estimatedFare:
                type: number
              actualFare:
                type: number
                nullable: true
                description: "Chi co gia tri sau khi status='completed' (RULE-03)."
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
    "404":
      $ref: '../../components/responses/_index.yaml#/NotFound'
