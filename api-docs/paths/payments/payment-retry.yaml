post:
  operationId: retryPayment
  tags: [Payments]
  summary: Thu lai thanh toan
  description: |
    Khach hang thu lai thanh toan (co the doi phuong thuc khac) sau khi giao dich
    dien tu that bai lan truoc (AC-03).
    Lien quan: FR-SYS-05, BR-17, EX-03
    Use Case: UC-CUS-04, AC-03
  security:
    - BearerAuth: []
  parameters:
    - name: tripId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [method]
          properties:
            method:
              type: string
              enum: [cash, e_wallet, credit_card]
            paymentToken:
              type: string
              description: "Bat buoc neu method != cash."
  responses:
    "200":
      description: Thanh toan thanh cong
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              transactionId:
                type: string
                nullable: true
              message:
                type: string
                example: "Thanh toan thanh cong"
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
    "402":
      description: Thanh toan that bai lan nua (EX-03)
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: "PAYMENT_FAILED"
              message:
                type: string
                example: "Giao dich bi tu choi. Vui long thu lai hoac chon phuong thuc khac."
    "404":
      $ref: '../../components/responses/_index.yaml#/NotFound'
