get:
  operationId: getPayment
  tags: [Payments]
  summary: Lay thong tin thanh toan cua chuyen
  description: |
    Xem thong tin hoa don: so tien, trang thai, phuong thuc.
    Lien quan: FR-SYS-04, BR-14, BR-15, RULE-03
    Use Case: UC-CUS-04, AC-01
  security:
    - BearerAuth: []
  parameters:
    - name: tripId
      in: path
      required: true
      schema:
        type: string
  responses:
    "200":
      description: Thanh cong
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/_index.yaml#/Payment'
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
    "404":
      $ref: '../../components/responses/_index.yaml#/NotFound'
post:
  operationId: createPayment
  tags: [Payments]
  summary: Thuc hien thanh toan
  description: |
    Khach hang xac nhan thanh toan (tien mat hoac dien tu). Neu dien tu: goi API
    cong thanh toan ben ngoai qua paymentToken (tu SDK cong thanh toan), khong luu
    thong tin the/tai khoan thanh toan trong he thong CAB (RULE-04). Neu tien mat:
    cho tai xe xac nhan da thu tien thi moi dong hoa don (AC-04).
    Lien quan: FR-SYS-05, BR-15, BR-16, BR-17, RULE-04
    Use Case: UC-CUS-04, AC-02, AC-04
  security:
    - BearerAuth: []
  parameters:
    - name: tripId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [method]
          properties:
            method:
              type: string
              enum: [cash, e_wallet, credit_card]
            paymentToken:
              type: string
              description: "Token tu SDK cong thanh toan (khong phai so the thuc). Bat buoc neu method != cash. Lien quan: RULE-04."
  responses:
    "200":
      description: Thanh toan thanh cong (hoac da ghi nhan cho tai xe xac nhan neu method=cash)
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [pending, success]
                example: "success"
              transactionId:
                type: string
                nullable: true
              message:
                type: string
                example: "Thanh toan thanh cong"
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
    "402":
      description: Thanh toan that bai - giao dich bi cong thanh toan tu choi (EX-03)
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: "PAYMENT_FAILED"
              message:
                type: string
                example: "Giao dich bi tu choi. Vui long thu lai hoac chon phuong thuc khac."
    "404":
      $ref: '../../components/responses/_index.yaml#/NotFound'
