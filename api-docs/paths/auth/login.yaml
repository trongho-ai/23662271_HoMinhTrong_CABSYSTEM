post:
  operationId: loginUser
  tags: [Auth]
  summary: Dang nhap
  description: |
    Xac thuc nguoi dung va tra ve JWT token.
    Lien quan: FR-CUS-01, FR-DRV-01, BR-01, BR-06, BR-31, RULE-07
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [phone, password]
          properties:
            phone:
              type: string
              example: "0901234567"
            password:
              type: string
              format: password
  responses:
    "200":
      description: Dang nhap thanh cong
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken:
                type: string
                description: JWT Bearer token
              tokenType:
                type: string
                example: "Bearer"
              expiresIn:
                type: integer
                example: 3600
              role:
                type: string
                enum: [customer, driver, operator, admin]
    "401":
      description: Sai thong tin dang nhap, hoac tai khoan dang bi khoa/cho duyet
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum: [INVALID_CREDENTIALS, ACCOUNT_BANNED, ACCOUNT_PENDING]
                example: "INVALID_CREDENTIALS"
              message:
                type: string
                example: "So dien thoai hoac mat khau khong dung"
