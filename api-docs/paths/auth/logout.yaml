  tags: [Auth]
  summary: Dang xuat
  description: |
    Huy token hien tai cua nguoi dung.
    Lien quan: BR-31, RULE-07
  security:
    - BearerAuth: []
  responses:
    "200":
      description: Dang xuat thanh cong
