get:
  operationId: listNotifications
  tags: [Notifications]
  summary: Lay danh sach thong bao cua nguoi dung
  description: |
    Lay tat ca thong bao cua khach hang hoac tai xe dang dang nhap.
    5 moc thong bao bat buoc cho khach hang (RULE-05): yeu cau duoc tiep nhan,
    co tai xe nhan chuyen, tai xe den diem don, chuyen hoan thanh, ket qua thanh toan.
    Thong bao cho tai xe (RULE-06): chuyen moi, thay doi lien quan chuyen dang thuc hien.
    Lien quan: FR-SYS-06, BR-18, BR-19, BR-20, RULE-05, RULE-06
  security:
    - BearerAuth: []
  parameters:
    - name: unreadOnly
      in: query
      schema:
        type: boolean
        default: false
    - name: page
      in: query
      schema:
        type: integer
        default: 1
  responses:
    "200":
      description: Thanh cong
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '../../components/schemas/_index.yaml#/Notification'
              total:
                type: integer
    "401":
      $ref: '../../components/responses/_index.yaml#/Unauthorized'
