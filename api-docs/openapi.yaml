openapi: 3.0.3
info:
  title: CAB System API
  description: |
    API documentation cho He thong dat xe CAB (CAB Booking System).
    Xay dung tu srs.md - Buoc 8 (Functional Requirements), Buoc 9 (Business Rules & Exceptions).

    ## Cac nhom chuc nang chinh
    - **Auth**: Dang ky, dang nhap, dang xuat
    - **Customers**: Quan ly ho so khach hang
    - **Drivers**: Quan ly ho so va trang thai tai xe
    - **Trips**: Dat xe, theo doi, cap nhat trang thai chuyen di
    - **Payments**: Thanh toan cuoc xe
    - **Notifications**: Thong bao push
    - **Admin**: Quan tri he thong (Users, Trips, Reports, Logs)

    ## Xac thuc
    Su dung JWT Bearer Token. Lay token tu endpoint POST /auth/login.
    Phan quyen: Customer < Driver < Operator < Admin (BR-24, BR-32, RULE-08).

    ## Lien ket nghiep vu (xem chi tiet trong srs.md)
    - FR (Functional Requirements): FR-CUS-01..08, FR-DRV-01..05, FR-SYS-01..06, FR-ADM-01..06
    - BR (Business Rules): BR-01..34
    - RULE / EX (Business Rules & Exceptions): RULE-01..10, EX-01..03
  version: 1.0.1
  contact:
    name: Ho Minh Trong
    email: 23662271@student.iuh.edu.vn

servers:
  - url: https://api.cabsystem.vn/v1
    description: Production Server
  - url: https://staging-api.cabsystem.vn/v1
    description: Staging Server
  - url: http://localhost:3000/v1
    description: Local Development

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Xac thuc nguoi dung (dang ky, dang nhap, dang xuat)
  - name: Customers
    description: Quan ly thong tin khach hang
