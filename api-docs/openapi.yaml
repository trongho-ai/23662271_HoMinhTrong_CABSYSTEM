paths:
  # ==================== AUTH ====================
  /auth/register:
    $ref: "./paths/auth/register.yaml"
  /auth/login:
    $ref: "./paths/auth/login.yaml"
  /auth/logout:
    $ref: "./paths/auth/logout.yaml"

  # ==================== CUSTOMERS ====================
  /customers/me:
    $ref: "./paths/customers/me.yaml"

  # ==================== DRIVERS ====================
  /drivers/me:
    $ref: "./paths/drivers/me.yaml"
  /drivers/me/availability:
    $ref: "./paths/drivers/availability.yaml"
  /drivers/me/location:
    $ref: "./paths/drivers/location.yaml"

  # ==================== TRIPS ====================
  /trips:
    $ref: "./paths/trips/trips.yaml"
  /trips/{tripId}:
    $ref: "./paths/trips/trip-detail.yaml"
  /trips/{tripId}/status:
    $ref: "./paths/trips/trip-status.yaml"
  /trips/{tripId}/accept:
    $ref: "./paths/trips/trip-accept.yaml"
  /trips/{tripId}/reject:
    $ref: "./paths/trips/trip-reject.yaml"
  /trips/{tripId}/review:
    $ref: "./paths/trips/trip-review.yaml"

  # ==================== PAYMENTS ====================
  /payments/{tripId}:
    $ref: "./paths/payments/payment.yaml"
  /payments/{tripId}/retry:
    $ref: "./paths/payments/payment-retry.yaml"

  # ==================== NOTIFICATIONS ====================
  /notifications:
    $ref: "./paths/notifications/notifications.yaml"

  # ==================== ADMIN ====================
  /admin/users:
    $ref: "./paths/admin/users.yaml"
  /admin/users/{userId}:
    $ref: "./paths/admin/user-detail.yaml"
  /admin/trips:
    $ref: "./paths/admin/trips.yaml"
  /admin/trips/{tripId}/cancel:
    $ref: "./paths/admin/trip-cancel.yaml"
  /admin/reports:
    $ref: "./paths/admin/reports.yaml"
  /admin/logs:
    $ref: "./paths/admin/logs.yaml"

