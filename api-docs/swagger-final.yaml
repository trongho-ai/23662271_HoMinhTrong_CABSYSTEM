        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/trips/{tripId}/cancel:
    post:
      operationId: cancelTripByAdmin
      tags:
        - Admin - Trips
      summary: Huy khan cap mot chuyen di
      description: |
        Nhan vien van hanh/Admin can thiep huy chuyen dang bi loi (VD: khach report,
        xe dung im qua lau). He thong gui thong bao ngay cho ca tai xe va khach hang
        (AC-02). Thao tac luu Audit Log: AdminID, TripID, action, timestamp (AC-03).
        Chi ap dung khi chuyen chua 'completed'.
        Lien quan: FR-ADM-02, BR-22, BR-34, RULE-10
        Use Case: UC-ADM-02, AC-01 (bao mat truy cap), AC-02, AC-03
      security:
        - BearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: Tai xe gap su co, khong the tiep tuc
      responses:
        '200':
          description: Huy chuyen thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripId:
                    type: string
                  status:
                    type: string
                    example: cancelled
                  message:
                    type: string
                    example: Da huy chuyen va thong bao cho cac ben
        '400':
          description: Chuyen da hoan thanh, khong the huy
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: TRIP_ALREADY_COMPLETED
                  message:
                    type: string
                    example: Chuyen da hoan thanh, khong the huy
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Khong du quyen (chi SuperAdmin/Operator - AC-01 bao mat truy cap)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/reports:
    get:
      operationId: getReports
      tags:
        - Admin - Reports
      summary: Xuat bao cao thong ke
      description: |
        Bao cao so chuyen, doanh thu, ty le hoan thanh, ty le huy, hieu suat tai xe
        theo khoang thoi gian (RULE-09 - cac chi so bat buoc). Phuc vu Ban lanh dao
        ra quyet dinh (BG-08).
        Lien quan: FR-ADM-05, BR-25, RULE-09
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-01-01'
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-09-09'
        - name: type
          in: query
          schema:
            type: string
            enum:
              - overview
              - revenue
              - driver_performance
              - cancellation
            default: overview
      responses:
        '200':
          description: Thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                  totalTrips:
                    type: integer
                    example: 1520
                  completedTrips:
                    type: integer
                    example: 1380
                  cancelledTrips:
                    type: integer
                    example: 140
                  completionRate:
                    type: number
                    example: 90.79
                    description: Ty le hoan thanh (%). RULE-09.
                  cancellationRate:
                    type: number
                    example: 9.21
                    description: Ty le huy (%). RULE-09.
                  totalRevenue:
                    type: number
                    example: 62100000
                    description: Tong doanh thu (VND). RULE-09.
                  topDrivers:
                    type: array
                    description: Hieu qua hoat dong tai xe. RULE-09.
                    items:
                      type: object
                      properties:
                        driverId:
                          type: string
                        fullName:
                          type: string
                        completedTrips:
                          type: integer
                        avgRating:
                          type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/logs:
    get:
      operationId: listLogs
      tags:
        - Admin - Logs
      summary: Xem System Log va Audit Log
      description: |
        Tra cuu nhat ky thao tac cua admin va loi he thong nghiem trong.
        Lien quan: FR-ADM-06, BR-33, BR-34, RULE-10
        Use Case: UC-ADM-02, AC-03
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - audit
              - system_error
            default: audit
        - name: adminId
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token lay tu POST /auth/login (hoac /auth/register).
        Bat buoc cho tat ca API tru /auth/register va /auth/login.
        Lien quan: BR-31, RULE-07.
  schemas:
    Customer:
      type: object
      description: Khach hang (Customer). ERD Buoc 10, BR-01.
      properties:
        customerId:
          type: string
          example: CUS-001
        fullName:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: '0901234567'
        email:
          type: string
          format: email
          nullable: true
        status:
          type: string
          enum:
            - active
            - banned
          description: Trang thai tai khoan (Buoc 10 ERD).
    Driver:
      type: object
      description: Tai xe (Driver). ERD Buoc 10, BR-06.
      properties:
        driverId:
          type: string
          example: DRV-001
        fullName:
          type: string
          example: Tran Van B
        phone:
          type: string
          example: '0909876543'
        status:
          type: string
          enum:
            - active
            - pending
            - banned
          description: |
            Trang thai tai khoan/ho so:
            - pending: Ho so/phuong tien dang cho Nhan vien van hanh duyet (FR-ADM-01)
            - active: Da duoc duyet, hoat dong binh thuong
            - banned: Bi khoa
        availabilityStatus:
          type: string
          enum:
            - online
            - offline
            - in_trip
          description: 'Trang thai san sang nhan chuyen. Lien quan: FR-DRV-02, BR-07, RULE-01.'
        currentLocation:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Location'
          description: 'Vi tri GPS gan nhat. Null neu tai xe chua tung gui vi tri. Lien quan: FR-DRV-05, BR-10.'
        vehicle:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Vehicle'
          description: Phuong tien dang dang ky. Null neu chua khai bao phuong tien.
    Location:
      type: object
      description: Toa do GPS (Buoc 10 ERD - PickupLocation/DropoffLocation/CurrentLocation).
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: double
          example: 10.7769
        lng:
          type: number
          format: double
          example: 106.7009
    Vehicle:
      type: object
      description: Phuong tien cua tai xe (Buoc 10 ERD).
      properties:
        vehicleId:
          type: string
          example: VEH-001
        licensePlate:
          type: string
          example: 51A-12345
        vehicleType:
          type: string
          enum:
            - 4_seat
            - 7_seat
            - motorbike
        brand:
          type: string
          example: Toyota Vios
        color:
          type: string
          example: Trang
    Trip:
      type: object
      description: 'Chuyen di (Buoc 10 ERD). Lien quan: BR-02, BR-03, BR-09, BR-14.'
      properties:
        tripId:
          type: string
          example: TRIP-001
        customerId:
          type: string
        driverId:
          type: string
          nullable: true
          description: Null khi chuyen dang o trang thai 'finding' (chua co tai xe).
        vehicleType:
          type: string
          enum:
            - 4_seat
            - 7_seat
            - motorbike
        pickupLocation:
          $ref: '#/components/schemas/Location'
        dropoffLocation:
          $ref: '#/components/schemas/Location'
        estimatedFare:
          type: number
          format: float
          description: 'Gia cuoc du kien, hien thi truoc khi khach xac nhan dat xe. Lien quan: FR-CUS-04.'
        actualFare:
          type: number
          format: float
          nullable: true
          description: 'Gia cuoc thuc te, chi co sau khi chuyen ''completed''. Lien quan: FR-SYS-04, RULE-03.'
        status:
          type: string
          enum:
            - finding
            - assigned
            - arrived
            - in_progress
            - completed
            - cancelled
          description: |
            Luong trang thai chuyen di (Buoc 6 Business Process, BR-09):
            finding -> assigned -> arrived -> in_progress -> completed
            (hoac -> cancelled tai bat ky buoc nao truoc completed)
        createdAt:
          type: string
          format: date-time
    Payment:
      type: object
      description: 'Thanh toan (Buoc 10 ERD). Lien quan: BR-14, BR-15, BR-16, BR-17.'
      properties:
        paymentId:
          type: string
          example: PAY-001
        tripId:
          type: string
        method:
          type: string
          enum:
            - cash
            - e_wallet
            - credit_card
        amount:
          type: number
          format: float
          example: 45000
        status:
          type: string
          enum:
            - pending
            - success
            - failed
        transactionId:
          type: string
          nullable: true
          description: 'Ma giao dich tra ve tu nha cung cap thanh toan ben ngoai. Null neu method=cash. Lien quan: BR-16, RULE-04.'
        paymentDate:
          type: string
          format: date-time
          nullable: true
    Review:
      type: object
      description: 'Danh gia tai xe sau chuyen (Buoc 10 ERD). Lien quan: BR-05.'
      properties:
        reviewId:
          type: string
          example: REV-001
        tripId:
          type: string
        customerId:
          type: string
        driverId:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    Notification:
      type: object
      description: |
        Thong bao day cho khach hang/tai xe. Lien quan: FR-SYS-06, BR-18, BR-19, BR-20, RULE-05, RULE-06.
      properties:
        notificationId:
          type: string
          example: NOTI-001
        recipientRole:
          type: string
          enum:
            - customer
            - driver
          description: 'Nguoi nhan thong bao nay (BR-18: khach hang / BR-19: tai xe).'
        type:
          type: string
          enum:
            - request_received
            - driver_assigned
            - driver_arrived
            - trip_completed
            - payment_result
            - new_trip_request
            - trip_cancelled
          description: |
            5 moc thong bao bat buoc cho khach hang (RULE-05):
            (1) request_received - yeu cau duoc tiep nhan
            (2) driver_assigned - co tai xe nhan chuyen
            (3) driver_arrived - tai xe da den diem don
            (4) trip_completed - chuyen hoan thanh
            (5) payment_result - co ket qua thanh toan

            Thong bao cho tai xe (RULE-06):
            - new_trip_request - co chuyen moi phu hop
            - trip_cancelled - chuyen dang thuc hien bi thay doi/huy (VD: Admin huy khan cap)
        title:
          type: string
          example: Tai xe da nhan chuyen
        body:
          type: string
          example: Tai xe Tran Van B (51A-12345) dang tren duong den diem don.
        tripId:
          type: string
          nullable: true
          description: Chuyen di lien quan (neu co).
        isRead:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
    AuditLog:
      type: object
      description: |
        Nhat ky thao tac quan tri (Audit Log). Lien quan: FR-ADM-06, BR-33, BR-34, RULE-10.
      properties:
        logId:
          type: string
          example: LOG-001
        adminId:
          type: string
          description: Nguoi thuc hien thao tac (Nhan vien van hanh/Admin).
        action:
          type: string
          example: CANCEL_TRIP
          description: 'Ma hanh dong, VD: CANCEL_TRIP, LOCK_USER, UNLOCK_USER, UPDATE_USER...'
        targetId:
          type: string
          description: TripID, UserID... tuy theo action.
        detail:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      description: Cau truc loi chung, dung cho hau het cac response 4xx.
      properties:
        code:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
          example: Token khong hop le hoac da het han
  responses:
    Unauthorized:
      description: |
        Chua xac thuc hoac token het han/khong hop le.
        Lien quan: BR-31, RULE-07 (bat buoc xac thuc truoc khi dung chuc nang can tai khoan).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: |
        Da xac thuc nhung khong du quyen thuc hien thao tac nay
        (VD: sai vai tro, hoac Nhan vien van hanh khong co quyen chuc nang nhay cam).
        Lien quan: BR-24, BR-32, RULE-08 (kiem soat quyen truy cap quan tri).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Khong tim thay tai nguyen (ID khong ton tai hoac khong thuoc ve nguoi dung hien tai).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Du lieu dau vao khong hop le (sai kieu, thieu truong bat buoc, sai gia tri enum...).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
