Customer:
  type: object
  description: "Khach hang (Customer). ERD Buoc 10, BR-01."
  properties:
    customerId:
      type: string
      example: "CUS-001"
    fullName:
      type: string
      example: "Nguyen Van A"
    phone:
      type: string
      example: "0901234567"
    email:
      type: string
      format: email
      nullable: true
    status:
      type: string
      enum: [active, banned]
      description: "Trang thai tai khoan (Buoc 10 ERD)."

Driver:
  type: object
  description: "Tai xe (Driver). ERD Buoc 10, BR-06."
  properties:
    driverId:
      type: string
      example: "DRV-001"
    fullName:
      type: string
      example: "Tran Van B"
    phone:
      type: string
      example: "0909876543"
    status:
      type: string
      enum: [active, pending, banned]
      description: |
        Trang thai tai khoan/ho so:
        - pending: Ho so/phuong tien dang cho Nhan vien van hanh duyet (FR-ADM-01)
        - active: Da duoc duyet, hoat dong binh thuong
        - banned: Bi khoa
    availabilityStatus:
      type: string
      enum: [online, offline, in_trip]
      description: "Trang thai san sang nhan chuyen. Lien quan: FR-DRV-02, BR-07, RULE-01."
    currentLocation:
      type: object
      nullable: true
      allOf:
        - $ref: '#/Location'
      description: "Vi tri GPS gan nhat. Null neu tai xe chua tung gui vi tri. Lien quan: FR-DRV-05, BR-10."
    vehicle:
      type: object
      nullable: true
      allOf:
        - $ref: '#/Vehicle'
      description: "Phuong tien dang dang ky. Null neu chua khai bao phuong tien."

Location:
  type: object
  description: "Toa do GPS (Buoc 10 ERD - PickupLocation/DropoffLocation/CurrentLocation)."
  required: [lat, lng]
  properties:
    lat:
      type: number
      format: double
      example: 10.7769
    lng:
      type: number
      format: double
      example: 106.7009

Vehicle:
  type: object
  description: "Phuong tien cua tai xe (Buoc 10 ERD)."
  properties:
    vehicleId:
      type: string
      example: "VEH-001"
    licensePlate:
      type: string
      example: "51A-12345"
    vehicleType:
      type: string
      enum: [4_seat, 7_seat, motorbike]
    brand:
      type: string
      example: "Toyota Vios"
    color:
      type: string
      example: "Trang"

Trip:
  type: object
  description: "Chuyen di (Buoc 10 ERD). Lien quan: BR-02, BR-03, BR-09, BR-14."
  properties:
    tripId:
      type: string
      example: "TRIP-001"
    customerId:
      type: string
    driverId:
      type: string
      nullable: true
      description: "Null khi chuyen dang o trang thai 'finding' (chua co tai xe)."
    vehicleType:
      type: string
      enum: [4_seat, 7_seat, motorbike]
    pickupLocation:
      $ref: '#/Location'
    dropoffLocation:
      $ref: '#/Location'
    estimatedFare:
      type: number
      format: float
      description: "Gia cuoc du kien, hien thi truoc khi khach xac nhan dat xe. Lien quan: FR-CUS-04."
    actualFare:
      type: number
      format: float
      nullable: true
      description: "Gia cuoc thuc te, chi co sau khi chuyen 'completed'. Lien quan: FR-SYS-04, RULE-03."
    status:
      type: string
      enum: [finding, assigned, arrived, in_progress, completed, cancelled]
      description: |
        Luong trang thai chuyen di (Buoc 6 Business Process, BR-09):
        finding -> assigned -> arrived -> in_progress -> completed
        (hoac -> cancelled tai bat ky buoc nao truoc completed)
    createdAt:
      type: string
      format: date-time

Payment:
  type: object
  description: "Thanh toan (Buoc 10 ERD). Lien quan: BR-14, BR-15, BR-16, BR-17."
  properties:
    paymentId:
      type: string
      example: "PAY-001"
    tripId:
      type: string
    method:
      type: string
      enum: [cash, e_wallet, credit_card]
    amount:
      type: number
      format: float
      example: 45000
    status:
      type: string
      enum: [pending, success, failed]
    transactionId:
      type: string
      nullable: true
      description: "Ma giao dich tra ve tu nha cung cap thanh toan ben ngoai. Null neu method=cash. Lien quan: BR-16, RULE-04."
    paymentDate:
      type: string
      format: date-time
      nullable: true

Review:
  type: object
  description: "Danh gia tai xe sau chuyen (Buoc 10 ERD). Lien quan: BR-05."
  properties:
    reviewId:
      type: string
      example: "REV-001"
    tripId:
      type: string
    customerId:
      type: string
    driverId:
      type: string
    rating:
      type: integer
      minimum: 1
      maximum: 5
    comment:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time

Notification:
  type: object
  description: |
    Thong bao day cho khach hang/tai xe. Lien quan: FR-SYS-06, BR-18, BR-19, BR-20, RULE-05, RULE-06.
  properties:
    notificationId:
      type: string
      example: "NOTI-001"
    recipientRole:
      type: string
      enum: [customer, driver]
      description: "Nguoi nhan thong bao nay (BR-18: khach hang / BR-19: tai xe)."
    type:
      type: string
      enum:
        - request_received
        - driver_assigned
        - driver_arrived
        - trip_completed
        - payment_result
        - new_trip_request
        - trip_cancelled
      description: |
        5 moc thong bao bat buoc cho khach hang (RULE-05):
        (1) request_received - yeu cau duoc tiep nhan
        (2) driver_assigned - co tai xe nhan chuyen
        (3) driver_arrived - tai xe da den diem don
        (4) trip_completed - chuyen hoan thanh
        (5) payment_result - co ket qua thanh toan

        Thong bao cho tai xe (RULE-06):
        - new_trip_request - co chuyen moi phu hop
        - trip_cancelled - chuyen dang thuc hien bi thay doi/huy (VD: Admin huy khan cap)
    title:
      type: string
      example: "Tai xe da nhan chuyen"
    body:
      type: string
      example: "Tai xe Tran Van B (51A-12345) dang tren duong den diem don."
    tripId:
      type: string
      nullable: true
      description: "Chuyen di lien quan (neu co)."
    isRead:
      type: boolean
      default: false
    createdAt:
      type: string
      format: date-time

AuditLog:
  type: object
  description: |
    Nhat ky thao tac quan tri (Audit Log). Lien quan: FR-ADM-06, BR-33, BR-34, RULE-10.
  properties:
    logId:
      type: string
      example: "LOG-001"
    adminId:
      type: string
      description: "Nguoi thuc hien thao tac (Nhan vien van hanh/Admin)."
    action:
      type: string
      example: "CANCEL_TRIP"
      description: "Ma hanh dong, VD: CANCEL_TRIP, LOCK_USER, UNLOCK_USER, UPDATE_USER..."
    targetId:
      type: string
      description: "TripID, UserID... tuy theo action."
    detail:
      type: string
      nullable: true
    timestamp:
      type: string
      format: date-time

ErrorResponse:
  type: object
  description: "Cau truc loi chung, dung cho hau het cac response 4xx."
  properties:
    code:
      type: string
      example: "UNAUTHORIZED"
    message:
      type: string
      example: "Token khong hop le hoac da het han"
